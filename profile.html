<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Profile UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Light Purple & Blue Mixed Theme */
            --bg-gradient: linear-gradient(180deg, #2b3a8c 0%, #161a3d 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #8e99c7;
            --accent-sky: #4da6ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 100px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Header Section */
        .header {
            padding: 30px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-pic-container {
            position: relative;
            width: 75px;
            height: 75px;
            cursor: pointer;
        }

        #displayPic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
        }

        .user-details h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .vip-badge {
            background: linear-gradient(90deg, #b8c6db, #f5f7fa);
            color: #2b3a8c;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
        }

        .uid-row {
            background: rgba(0,0,0,0.2);
            padding: 4px 10px;
            border-radius: 5px;
            margin-top: 8px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffcc00;
        }

        /* Balance Card */
        .balance-section {
            padding: 0 15px;
            margin-bottom: 20px;
        }
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
        }
        .balance-card h3 { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 10px; }
        .balance-val { font-size: 1.8rem; font-weight: bold; }

        /* Icon Grid (The Curved Boxes) */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
        }

        .grid-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 18px; /* High curve as requested */
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            cursor: pointer;
        }
        
        .grid-box:active { transform: scale(0.96); background: rgba(255,255,255,0.15); }

        .icon-sq {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        /* Colorful Icon Gradients */
        .bg-blue { background: linear-gradient(135deg, #5b86e5, #36d1dc); }
        .bg-green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .bg-red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .bg-orange { background: linear-gradient(135deg, #f39c12, #d35400); }

        .box-title { font-weight: 600; font-size: 0.95rem; }
        .box-sub { font-size: 0.75rem; color: var(--text-sub); }

        /* Menu List */
        .menu-list {
            margin: 20px 15px;
            background: var(--card-bg);
            border-radius: 15px;
        }

        .menu-item {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Service Center */
        .service-title { padding: 15px 20px; color: var(--text-sub); font-size: 0.9rem; }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            padding: 0 15px;
            gap: 20px;
        }
        .service-item i { font-size: 1.5rem; color: var(--accent-sky); margin-bottom: 8px; display: block; }

        /* Log out Button */
        .logout-container { padding: 30px 20px; }
        .logout-btn {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--accent-sky);
            background: transparent;
            color: var(--accent-sky);
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover { background: var(--accent-sky); color: white; }

        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="profile-pic-container" onclick="document.getElementById('fileInput').click()">
            <img id="displayPic" src="https://i.imgur.com/8Km9tLL.png" alt="Profile">
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="user-details">
            <h2 id="nameTag">USER_NAME <span class="vip-badge">VIP1</span></h2>
            <div class="uid-row">UID | <span id="uidTag">-------</span> <i class="fa-regular fa-copy" style="font-size: 0.7rem; cursor: pointer;"></i></div>
        </div>
    </div>

    <div class="balance-section">
        <div class="balance-card">
            <h3>Total balance</h3>
            <div class="balance-val">₹0.00 <i class="fa-solid fa-arrows-rotate" style="font-size: 1rem; color: var(--accent-sky); margin-left: 10px;"></i></div>
        </div>
    </div>

    <div class="grid-container">
        <div class="grid-box">
            <div class="icon-sq bg-blue"><i class="fa-solid fa-file-invoice"></i></div>
            <div>
                <div class="box-title">Game History</div>
                <div class="box-sub">My game history</div>
            </div>
        </div>
        <div class="grid-box">
            <div class="icon-sq bg-green"><i class="fa-solid fa-receipt"></i></div>
            <div>
                <div class="box-title">Transaction</div>
                <div class="box-sub">My transaction history</div>
            </div>
        </div>
        <div class="grid-box">
            <div class="icon-sq bg-red"><i class="fa-solid fa-file-circle-plus"></i></div>
            <div>
                <div class="box-title">Deposit</div>
                <div class="box-sub">My deposit history</div>
            </div>
        </div>
        <div class="grid-box">
            <div class="icon-sq bg-orange"><i class="fa-solid fa-briefcase"></i></div>
            <div>
                <div class="box-title">Withdraw</div>
                <div class="box-sub">My withdraw history</div>
            </div>
        </div>
    </div>

    <div class="menu-list">
        <div class="menu-item">
            <span><i class="fa-solid fa-bell" style="color: #4da6ff; margin-right: 10px;"></i> Notification</span>
            <span style="background: #ff4d4d; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.65rem;">1</span>
        </div>
        <div class="menu-item">
            <span><i class="fa-solid fa-gift" style="color: #ffcc00; margin-right: 10px;"></i> Gifts</span>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-sub)"></i>
        </div>
        <div class="menu-item">
            <span><i class="fa-solid fa-chart-simple" style="color: #4da6ff; margin-right: 10px;"></i> Game statistics</span>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-sub)"></i>
        </div>
    </div>

    <div class="service-title">Service center</div>
    <div class="service-grid">
        <div class="service-item"><i class="fa-solid fa-gear"></i><span>Settings</span></div>
        <div class="service-item"><i class="fa-solid fa-clipboard-question"></i><span>Feedback</span></div>
        <div class="service-item"><i class="fa-solid fa-bullhorn"></i><span>Notice</span></div>
        <div class="service-item"><i class="fa-solid fa-headset"></i><span>Support</span></div>
        <div class="service-item"><i class="fa-solid fa-book-open"></i><span>Guide</span></div>
        <div class="service-item"><i class="fa-solid fa-circle-info"></i><span>About us</span></div>
    </div>

    <div class="logout-container">
        <button class="logout-btn" onclick="handleLogout()">
            <i class="fa-solid fa-power-off"></i> Log out
        </button>
    </div>
</div>

<script>
    // 1. Fixed UID and Name Generation
    window.onload = function() {
        if (!localStorage.getItem('userUID')) {
            const newUID = Math.floor(7000000 + Math.random() * 900000);
            const newName = "MEMBER" + Math.random().toString(36).substring(2, 7).toUpperCase();
            localStorage.setItem('userUID', newUID);
            localStorage.setItem('userName', newName);
        }

        document.getElementById('uidTag').innerText = localStorage.getItem('userUID');
        document.getElementById('nameTag').innerHTML = localStorage.getItem('userName') + ' <span class="vip-badge">VIP1</span>';

        // Load Persistent Image
        const savedImg = localStorage.getItem('profileImg');
        if (savedImg) {
            document.getElementById('displayPic').src = savedImg;
        }
    }

    // 2. Photo Persistence
    document.getElementById('fileInput').onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                document.getElementById('displayPic').src = base64;
                localStorage.setItem('profileImg', base64);
            }
            reader.readAsDataURL(file);
        }
    }

    // 3. Working Logout Button
    function handleLogout() {
        if (confirm("Are you sure you want to log out?")) {
            // Clearing UID for demo - in real app, you just redirect
            alert("Logging out...");
            location.reload(); 
        }
    }
</script>

</body>
</html>
