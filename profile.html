<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile | HappyWorld</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        
        body { 
            /* Same to same Registration Background */
            background: linear-gradient(180deg, #9d50bb 0%, #6e48aa 40%, #2b324d 100%);
            background-attachment: fixed;
            color: white;
            padding-bottom: 80px;
        }

        /* Top Header Section */
        .profile-header {
            padding: 40px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; }
        .user-info h2 { font-size: 18px; margin-bottom: 5px; color: #ff52f1; } /* Logo Pink */
        .uid-box { font-size: 13px; color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; }

        /* Wallet Section */
        .wallet-card {
            width: 92%; margin: 0 auto;
            background: white; color: #333;
            border-radius: 20px; padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .balance-label { font-size: 14px; color: #666; }
        .balance-amount { font-size: 28px; font-weight: bold; margin: 10px 0; }
        
        .action-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 10px; margin-top: 20px; text-align: center;
        }
        .action-item img { width: 35px; margin-bottom: 5px; }
        .action-item p { font-size: 12px; font-weight: 500; }

        /* Menu List */
        .menu-container { width: 92%; margin: 20px auto; background: rgba(255,255,255,0.1); border-radius: 15px; }
        .menu-item {
            padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
        }
        .menu-item:last-child { border: none; }

        /* Logout Button */
        .logout-btn {
            width: 92%; margin: 30px auto;
            border: 2px solid #ff4d4d; color: #ff4d4d;
            padding: 15px; border-radius: 30px;
            text-align: center; font-weight: bold;
            background: transparent; cursor: pointer;
            display: block;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; border-radius: 20px 20px 0 0;
        }
        .nav-tab { color: #999; text-align: center; font-size: 12px; }
        .nav-tab.active { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="profile-header">
        <img src="https://i.pravatar.cc/150?img=32" class="avatar">
        <div class="user-info">
            <h2 id="userName">MEMBER_USER</h2>
            <div class="uid-box">UID | <span id="uidVal">20126115</span></div>
        </div>
    </div>

    <div class="wallet-card">
        <p class="balance-label">Total balance</p>
        <p class="balance-amount">₹<span id="balanceVal">0.00</span></p>
        
        <div class="action-grid">
            <div class="action-item">
                <img src="https://cdn-icons-png.flaticon.com/512/657/657076.png">
                <p>Deposit</p>
            </div>
            <div class="action-item">
                <img src="https://cdn-icons-png.flaticon.com/512/1019/1019607.png">
                <p>Withdraw</p>
            </div>
            <div class="action-item">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">
                <p>VIP</p>
            </div>
            <div class="action-item">
                <img src="https://cdn-icons-png.flaticon.com/512/261/261057.png">
                <p>Wallet</p>
            </div>
        </div>
    </div>

    <div class="menu-container">
        <div class="menu-item"><span>Game History</span> <span>></span></div>
        <div class="menu-item"><span>Transaction History</span> <span>></span></div>
        <div class="menu-item"><span>Notifications</span> <span>></span></div>
        <div class="menu-item"><span>Gifts</span> <span>></span></div>
        <div class="menu-item"><span>Settings</span> <span>></span></div>
    </div>

    <button class="logout-btn" onclick="logoutUser()">Log out</button>

    <div class="bottom-nav">
        <div class="nav-tab">Home</div>
        <div class="nav-tab">Activity</div>
        <div class="nav-tab">Promotion</div>
        <div class="nav-tab active">Account</div>
    </div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", 
        databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com",
        projectId: "happy-world-25c08"
    };
    firebase.initializeApp(firebaseConfig);

    // Fetch User Data
    const mobile = localStorage.getItem("userMobile");
    if(!mobile) {
        window.location.href = 'login.html';
    } else {
        document.getElementById("userName").innerText = "MEMBER_" + mobile.substring(6);
        document.getElementById("uidVal").innerText = mobile;
        
        firebase.database().ref('users/' + mobile).on('value', (snap) => {
            if(snap.exists()) {
                document.getElementById("balanceVal").innerText = snap.val().balance.toFixed(2);
            }
        });
    }

    function logoutUser() {
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
