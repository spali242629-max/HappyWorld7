<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyWorld | Register</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        body { 
            /* Tera bheja hua background image */
            background: url('1000129556.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-logo {
            margin-top: 50px;
            width: 250px; /* Happy World Logo */
        }

        .register-container {
            width: 90%;
            margin-top: 30px;
        }

        .title { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 30px; }

        .input-label { font-size: 14px; margin-bottom: 10px; display: block; }

        /* Tiranga Style Input Box */
        .input-group {
            background: rgba(43, 50, 77, 0.9);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 16px;
            margin-left: 10px;
        }

        .country-code {
            padding-right: 10px;
            border-right: 1px solid #555;
            font-weight: bold;
        }

        /* Register Button */
        .reg-btn {
            width: 100%;
            background: #2994ff;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #2994ff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <img src="1000129565.jpg" alt="HappyWorld" class="header-logo">

    <div class="register-container">
        <div class="title">Register</div>
        <div class="subtitle">Please register by phone number or email</div>

        <span class="input-label">Register your phone</span>
        <div class="input-group">
            <span class="country-code">+91</span>
            <input type="number" id="phone" placeholder="Please enter the phone number">
        </div>

        <span class="input-label">Set password</span>
        <div class="input-group">
            <input type="password" id="pass" placeholder="Set password">
        </div>

        <span class="input-label">Confirm password</span>
        <div class="input-group">
            <input type="password" id="confirmPass" placeholder="Confirm password">
        </div>

        <button class="reg-btn" onclick="registerUser()">Register</button>
        
        <div class="login-link">
            I have an account <span style="font-weight:bold">Login</span>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", 
            authDomain: "happy-world-25c08.firebaseapp.com",
            databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com",
            projectId: "happy-world-25c08"
        };
        firebase.initializeApp(firebaseConfig);

        function registerUser() {
            const p = document.getElementById("phone").value;
            const s = document.getElementById("pass").value;
            const c = document.getElementById("confirmPass").value;

            if(p.length < 10) return alert("Number sahi dalo!");
            if(s !== c) return alert("Password match nahi kar raha!");

            firebase.database().ref('users/' + p).set({
                mobile: p, password: s, balance: 0
            }).then(() => {
                window.location.href = "home.html";
            }).catch(e => alert(e.message));
        }
    </script>
</body>
</html>
