<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyWorld | Register</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --bg-color: #101524; /* Deep Dark Blue from your photo */
            --input-bg: #222a42; 
            --text-blue: #40c4ff; 
            --btn-blue: #2994ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: white; 
            min-height: 100vh;
        }

        /* HappyWorld Header Style */
        .header { 
            padding: 40px 0 20px; 
            text-align: center; 
        }
        .header h1 { 
            color: var(--text-blue); 
            font-size: 38px; 
            font-weight: 900; 
            letter-spacing: -1px;
            text-shadow: 0 0 10px rgba(64, 196, 255, 0.3);
        }

        .container { padding: 0 25px; }
        .title { font-size: 22px; font-weight: bold; margin-bottom: 5px; text-align: left; }
        .subtitle { font-size: 13px; color: #7c839d; margin-bottom: 30px; }

        .form-label { font-size: 14px; margin-bottom: 10px; display: block; color: #fff; }

        /* Input Box Style */
        .input-group {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-group input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            font-size: 16px;
            outline: none;
            margin-left: 10px;
        }
        .input-group input::placeholder { color: #565e79; }
        .country-code { color: #fff; padding-right: 12px; border-right: 1px solid #444; font-weight: 600; }

        /* Register Button */
        .btn-register {
            width: 100%;
            background: var(--btn-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(41, 148, 255, 0.3);
        }

        .btn-login-outline {
            width: 100%;
            background: transparent;
            border: 1px solid var(--btn-blue);
            color: var(--btn-blue);
            padding: 14px;
            border-radius: 30px;
            margin-top: 20px;
            font-size: 15px;
            font-weight: 500;
        }

        .agreement { font-size: 12px; color: #7c839d; margin-top: 15px; text-align: left; }
    </style>
</head>
<body>

    <div class="header">
        <h1>HappyWorld</h1>
    </div>

    <div class="container">
        <div class="title">Register</div>
        <div class="subtitle">Please register by phone number or email</div>

        <span class="form-label">Register your phone</span>
        <div class="input-group">
            <span class="country-code">+91</span>
            <input type="number" id="phone" placeholder="Please enter the phone number">
        </div>

        <span class="form-label">Set password</span>
        <div class="input-group">
            <input type="password" id="pass" placeholder="Set password">
        </div>

        <span class="form-label">Confirm password</span>
        <div class="input-group">
            <input type="password" id="confirmPass" placeholder="Confirm password">
        </div>

        <span class="form-label">Invite code</span>
        <div class="input-group">
