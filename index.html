<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyWorld | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rock+Salt&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(180deg, #9d50bb 0%, #6e48aa 40%, #2b324d 100%);
            background-attachment: fixed; min-height: 100vh; color: white;
            display: flex; flex-direction: column; align-items: center; padding: 50px 20px;
        }
        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-main { font-family: 'Permanent Marker', cursive; font-size: 50px; color: #ff52f1; transform: rotate(-3deg); display: inline-block; text-shadow: 3px 3px 0px rgba(0,0,0,0.2); }
        .logo-sub { font-family: 'Rock Salt', cursive; font-size: 32px; color: white; margin-left: 10px; }
        .container { width: 100%; max-width: 400px; }
        .title { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 35px; }
        .input-group { background: rgba(43, 50, 77, 0.8); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-group input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 16px; margin-left: 10px; }
        .country-tag { font-weight: bold; padding-right: 12px; border-right: 1px solid rgba(255,255,255,0.2); }
        .reg-btn { width: 100%; background: #2994ff; color: white; border: none; padding: 18px; border-radius: 35px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; box-shadow: 0 8px 20px rgba(41, 148, 255, 0.3); }
        .login-link { text-align: center; margin-top: 30px; font-size: 15px; }
        .login-link b { color: #2994ff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="logo-container"><span class="logo-main">Happy</span><span class="logo-sub">World</span></div>
    <div class="container">
        <div class="title">Register</div>
        <p class="subtitle">Please register by phone number or email</p>
        <div class="input-group"><span class="country-tag">+91</span><input type="number" id="phone" placeholder="Phone number"></div>
        <div class="input-group"><input type="password" id="pass" placeholder="Set password"></div>
        <div class="input-group"><input type="password" id="confirm" placeholder="Confirm password"></div>
        <div class="input-group"><input type="text" id="invite" placeholder="Invitation code"></div>
        <button class="reg-btn" onclick="save()">Register</button>
        <div class="login-link">I have an account <b onclick="window.location.href='login.html'">Login</b></div>
    </div>
<script>
    const firebaseConfig = { apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com", projectId: "happy-world-25c08" };
    firebase.initializeApp(firebaseConfig);
    function save() {
        const p = document.getElementById("phone").value;
        const s = document.getElementById("pass").value;
        const c = document.getElementById("confirm").value;
        if(p.length < 10) return alert("Number sahi dalo!");
        if(s !== c) return alert("Password match nahi hua!");
        firebase.database().ref('users/' + p).set({ mobile: p, password: s, balance: 0 }).then(() => {
            localStorage.setItem("userMobile", p); // FIX: Memory save
            window.location.href = "profile.html";
        });
    }
</script>
</body>
</html>
