<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy World - Home</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f0f0f0; font-family: Arial, sans-serif; text-align: center; padding-top: 50px;">

    <h1>Welcome to Happy World</h1>
    <p>Loading your profile...</p>

    <script src="script.js"></script>
    <script>
        // Check if user is logged in
        const user = localStorage.getItem("userMobile");
        if (!user) {
            // Agar mobile number save nahi hai, toh login page par bhejo
            window.location.href = "login.html";
        } else {
            // Agar login hai, toh game dashboard par bhej do
            // Aap yahan apne game wali file ka naam likhein (e.g., home.html ya game.html)
            window.location.href = "home.html"; 
        }
    </script>
</body>
</html>
