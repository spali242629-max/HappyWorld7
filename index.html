<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyWorld | Register</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            /* Full Screen Background Image */
            background: url('1000129556.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        /* Tera bheja hua Happy World Text Logo */
        .logo-img {
            width: 250px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255, 82, 241, 0.5));
        }

        .container {
            width: 90%;
            max-width: 400px;
            /* Beech wala square box hata diya */
        }

        .title { font-size: 26px; font-weight: bold; margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 35px; text-align: center; }

        .form-label { font-size: 14px; margin-bottom: 10px; display: block; font-weight: 500; }

        /* Full Transparent Input Group */
        .input-group {
            background: rgba(43, 50, 77, 0.7); /* Thoda transparent dark blue */
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 16px;
            margin-left: 10px;
        }

        .country-code {
            font-weight: bold;
            border-right: 1px solid rgba(255,255,255,0.3);
            padding-right: 12px;
        }

        /* Full Width Professional Blue Button */
        .reg-btn {
            width: 100%;
            background: #2994ff; 
            color: white;
            border: none;
            padding: 18px;
            border-radius: 35px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(41, 148, 255, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 15px;
            color: rgba(255,255,255,0.8);
        }
        .login-link b { color: #2994ff; }
    </style>
</head>
<body>

    <img src="1000129565.jpg" alt="HappyWorld" class="logo-img">

    <div class="container">
        <div class="title">Register</div>
        <p class="subtitle">Please register by phone number or email</p>

        <span class="form-label">Register your phone</span>
        <div class="input-group">
            <span class="country-code">+91</span>
            <input type="number" id="phone" placeholder="Please enter the phone number">
        </div>

        <span class="form-label">Set password</span>
        <div class="input-group">
            <input type="password" id="pass" placeholder="Set password">
        </div>

        <span class="form-label">Confirm password</span>
        <div class="input-group">
            <input type="password" id="confirmPass" placeholder="Confirm password">
        </div>

        <span class="form-label">Invite code</span>
        <div class="input-group">
            <input type="text" id="invite" placeholder="Please enter the invitation code">
        </div>

        <button class="reg-btn" onclick="saveData()">Register</button>
        
        <div class="login-link">
            I have an account <span style="font-weight:bold; color:#2994ff">Login</span>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", 
        authDomain: "happy-world-25c08.firebaseapp.com",
        databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com",
        projectId: "happy-world-25c08"
    };
    firebase.initializeApp(firebaseConfig);

    function saveData() {
        const p = document.getElementById("phone").value;
        const s = document.getElementById("pass").value;
        const c = document.getElementById("confirmPass").value;

        if(p.length < 10) return alert("Bhai, number sahi dalo!");
        if(s !== c) return alert("Password match nahi hua!");

        firebase.database().ref('users/' + p).set({
            mobile: p, password: s, balance: 0
        }).then(() => {
            window.location.href = "home.html";
        }).catch(err => alert(err.message));
    }
</script>
</body>
</html>
