<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy World - Tiranga Games Style</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body style="margin:0; padding:0; background:#f5f5f5; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center;">

    <div id="loading">
        <h2 style="color: #ff9933;">Happy World</h2>
        <p>Checking login status...</p>
    </div>

    <script>
        // 1. Aapka Firebase Config (Jo aapne pehle copy kiya tha)
        const firebaseConfig = {
            apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", 
            authDomain: "happy-world-25c08.firebaseapp.com",
            databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com",
            projectId: "happy-world-25c08",
            storageBucket: "happy-world-25c08.appspot.com",
            messagingSenderId: "192294282796",
            appId: "1:192294282796:web:be56e1..."
        };

        // 2. Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // 3. Login Check Logic
        setTimeout(() => {
            const userMobile = localStorage.getItem("userMobile");
            if (!userMobile) {
                // Agar login nahi hai toh register page par bhejo
                window.location.href = "register.html";
            } else {
                // Agar login hai toh seedhe game page (home.html)
                window.location.href = "home.html";
            }
        }, 2000);
    </script>
</body>
</html>
