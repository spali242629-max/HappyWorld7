<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy World - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0bbff, #d7a8ff, #c084fc); /* Light purple gradient */
      min-height: 100vh;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    
    .header {
      text-align: center;
      margin-bottom: 35px;
    }
    
    .glow-title {
      font-size: 2.6rem;
      font-weight: 700;
      color: #ff004c; /* Vibrant red */
      text-shadow: 
        0 0 10px #ff004c88,
        0 0 20px #ff004c66,
        0 0 40px #ff004c44,
        0 0 80px #ff004c22; /* Red aura/glow effect */
      letter-spacing: 1px;
      animation: glow-pulse 3s infinite alternate;
    }
    
    @keyframes glow-pulse {
      from { text-shadow: 0 0 10px #ff004c88, 0 0 20px #ff004c66, 0 0 40px #ff004c33; }
      to   { text-shadow: 0 0 20px #ff004cff, 0 0 40px #ff004ccc, 0 0 80px #ff004c88; }
    }
    
    h2 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #4a148c; /* Dark purple */
      margin-bottom: 12px;
    }
    
    .subtitle {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 30px;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 2px solid #e0d4ff;
    }
    
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-weight: 600;
      color: #777;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .tab.active {
      color: #7c3aed;
      border-bottom: 3px solid #7c3aed;
    }
    
    .input-group {
      margin-bottom: 22px;
      position: relative;
    }
