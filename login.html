<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyWorld | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rock+Salt&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(180deg, #9d50bb 0%, #6e48aa 40%, #2b324d 100%);
            background-attachment: fixed; min-height: 100vh; color: white;
            display: flex; flex-direction: column; align-items: center; padding: 60px 20px;
        }
        .logo-container { text-align: center; margin-bottom: 40px; }
        .logo-main { font-family: 'Permanent Marker', cursive; font-size: 50px; color: #ff52f1; transform: rotate(-3deg); display: inline-block; }
        .logo-sub { font-family: 'Rock Salt', cursive; font-size: 32px; color: white; margin-left: 10px; }
        .container { width: 100%; max-width: 400px; }
        .title { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 40px; }
        .input-group { background: rgba(43, 50, 77, 0.8); border-radius: 12px; padding: 16px; margin-bottom: 25px; display: flex; align-items: center; border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-group input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 16px; margin-left: 10px; }
        .phone-icon { font-weight: bold; padding-right: 12px; border-right: 1px solid rgba(255,255,255,0.2); }
        .login-btn { width: 100%; background: #2994ff; color: white; border: none; padding: 18px; border-radius: 35px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(41, 148, 255, 0.3); }
        .footer-links { text-align: center; margin-top: 35px; font-size: 15px; }
        .footer-links b { color: #2994ff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="logo-container"><span class="logo-main">Happy</span><span class="logo-sub">World</span></div>
    <div class="container">
        <div class="title">Login</div>
        <p class="subtitle">Please log in with your phone number</p>
        <div class="input-group"><span class="phone-icon">+91</span><input type="number" id="loginPhone" placeholder="Phone number"></div>
        <div class="input-group"><input type="password" id="loginPass" placeholder="Password"></div>
        <button class="login-btn" onclick="handleLogin()">Login</button>
        <div class="footer-links">Don't have an account? <b onclick="window.location.href='index.html'">Register</b></div>
    </div>
<script>
    const firebaseConfig = { apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com", projectId: "happy-world-25c08" };
    firebase.initializeApp(firebaseConfig);
    function handleLogin() {
        const phone = document.getElementById("loginPhone").value;
        const pass = document.getElementById("loginPass").value;
        if(!phone || !pass) return alert("Details bharo!");
        firebase.database().ref('users/' + phone).once('value', (snap) => {
            if(snap.exists() && snap.val().password === pass){
                localStorage.setItem("userMobile", phone); // FIX: Memory save
                window.location.href = "profile.html";
            } else { alert("Galt details!"); }
        });
    }
</script>
</body>
</html>
