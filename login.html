<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyWorld | The Future</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0055; --secondary: #00fbff; --accent: #7000ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505; height: 100vh; display: flex; justify-content: center; 
            align-items: center; font-family: 'Space Grotesk', sans-serif; overflow: hidden;
        }

        /* Moving Cosmic Nebula Background */
        .bg-animate {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, #1a0033 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #001a33 0%, transparent 40%);
            z-index: -1; filter: blur(50px); animation: move 20s infinite alternate;
        }
        @keyframes move { from { transform: scale(1); } to { transform: scale(1.2); } }

        .glass-card {
            width: 90%; max-width: 400px; padding: 40px; border-radius: 40px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 100px rgba(0, 0, 0, 0.8), 0 0 20px rgba(112, 0, 255, 0.2);
            text-align: center; position: relative; transition: 0.5s;
        }

        .logo-box { margin-bottom: 40px; }
        .logo-box h1 {
            font-family: 'Syncopate', sans-serif; font-size: 40px;
            background: linear-gradient(to bottom, #fff 20%, var(--secondary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 251, 255, 0.4));
            letter-spacing: -2px;
        }

        .input-container { position: relative; margin-bottom: 25px; }
        .input-container input {
            width: 100%; padding: 18px 25px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            color: #fff; font-size: 16px; outline: none; transition: 0.4s;
            letter-spacing: 1px;
        }
        .input-container input:focus {
            border-color: var(--secondary); background: rgba(0, 251, 255, 0.05);
            box-shadow: 0 0 25px rgba(0, 251, 255, 0.15);
        }

        .btn-glow {
            width: 100%; padding: 20px; border-radius: 22px; border: none;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: #fff; font-weight: 800; font-size: 18px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 3px; position: relative;
            overflow: hidden; transition: 0.4s;
        }
        .btn-glow:hover {
            transform: translateY(-5px); 
            box-shadow: 0 15px 40px rgba(255, 0, 85, 0.4), 0 0 20px rgba(112, 0, 255, 0.6);
        }

        .links { margin-top: 30px; font-size: 14px; color: rgba(255,255,255,0.4); }
        .links a { 
            color: var(--secondary); text-decoration: none; font-weight: 700; 
            padding-left: 5px; text-shadow: 0 0 10px rgba(0, 251, 255, 0.3);
        }

        /* Scanline Effect */
        .glass-card::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg-animate"></div>
    <div class="glass-card">
        <div class="logo-box">
            <h1>HAPPYWORLD</h1>
            <p style="color:var(--secondary); font-size:10px; letter-spacing:5px; margin-top:5px;">ACCESS GRANTED</p>
        </div>
        
        <div class="input-container">
            <input type="number" id="m" placeholder="SECURE MOBILE ID">
        </div>
        <div class="input-container">
            <input type="password" id="p" placeholder="ENCRYPTED ACCESS KEY">
        </div>

        <button class="btn-glow" onclick="login()">AUTHENTICATE</button>

        <div class="links">
            NEW AGENT? <a href="register.html">INITIALIZE ACCOUNT</a>
        </div>
    </div>

<script>
    // Tera Firebase Config (Real waala dalo)
    const firebaseConfig = {
        apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", 
        authDomain: "happy-world-25c08.firebaseapp.com",
        databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com",
        projectId: "happy-world-25c08",
        storageBucket: "happy-world-25c08.appspot.com",
        messagingSenderId: "192294282796",
        appId: "1:192294282796:web:be56e1..."
    };
    firebase.initializeApp(firebaseConfig);

    function login() {
        const mobile = document.getElementById("m").value;
        const pass = document.getElementById("p").value;
        if(!mobile || !pass) return alert("Fill Credentials");

        firebase.database().ref('users/' + mobile).once('value', (s) => {
            if(s.exists() && s.val().password === pass) {
                localStorage.setItem("userMobile", mobile); // Loop Fix
                window.location.href = "home.html";
            } else { alert("ACCESS DENIED: Wrong ID/Key"); }
        });
    }
</script>
</body>
</html>
