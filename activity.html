<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity - HappyWorld</title>
    <style>
        body { background: #0d122b; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        .header { background: #161d3a; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
        .banner { width: 90%; margin: 15px auto; display: block; border-radius: 10px; background: linear-gradient(90deg, #ff9800, #ff5722); padding: 40px 0; text-align: center; font-size: 20px; font-weight: bold; }
        .activity-list { padding: 15px; margin-bottom: 80px; }
        .item { background: #1c244a; margin-bottom: 15px; padding: 15px; border-radius: 12px; display: flex; align-items: center; border: 1px solid #3a467d; }
        .item-icon { font-size: 30px; margin-right: 15px; }
        .item-text h4 { margin: 0; color: #ffeb3b; }
        .item-text p { margin: 5px 0 0; font-size: 12px; color: #aaa; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #161d3a; padding: 10px 0; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; text-align: center; }
        .bottom-nav a.active { color: #ffeb3b; }
    </style>
</head>
<body>
    <div class="header">Activity</div>

    <div class="banner">
        REWARD CENTER <br>
        <span style="font-size: 12px;">Complete tasks to get rewards</span>
    </div>

    <div class="activity-list">
        <div class="item">
            <div class="item-icon">🎁</div>
            <div class="item-text">
                <h4>Sign-in Bonus</h4>
                <p>Get daily rewards for logging in.</p>
            </div>
        </div>
        <div class="item">
            <div class="item-icon">🔥</div>
            <div class="item-text">
                <h4>Invitation Bonus</h4>
                <p>Refer friends and earn up to ₹10,000.</p>
            </div>
        </div>
        <div class="item">
            <div class="item-icon">💰</div>
            <div class="item-text">
                <h4>First Deposit</h4>
                <p>100% bonus on your first recharge.</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html">🏠<br>Home</a>
        <a href="activity.html" class="active">🏆<br>Activity</a>
        <a href="index.html">👤<br>Account</a>
    </nav>
</body>
</html>
