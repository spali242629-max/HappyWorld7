<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyWorld | Dimension 11</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --base-purple: #1a0b2e; --shadow-dark: #0f061a; --shadow-light: #251042; --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { 
            background: var(--base-purple); 
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .phone-frame {
            width: 90%; max-width: 380px; padding: 40px 25px;
            background: var(--base-purple);
            border-radius: 50px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            text-align: center;
        }

        .logo-area h1 {
            font-size: 32px; font-weight: 900; color: var(--gold);
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .neo-input-group { margin-bottom: 30px; }
        .neo-input {
            width: 100%; padding: 18px; background: var(--base-purple);
            border: none; border-radius: 15px; color: #fff; font-size: 16px;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            outline: none; transition: 0.3s;
        }
        .neo-input:focus { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); color: var(--gold); }

        .btn-11 {
            width: 100%; padding: 20px; margin-top: 10px;
            background: var(--base-purple); border: none; border-radius: 15px;
            color: var(--gold); font-size: 18px; font-weight: 800;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        .btn-11:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.98);
        }

        .footer { margin-top: 30px; font-size: 13px; color: #6e5a8d; }
        .footer a { color: var(--gold); text-decoration: none; font-weight: 700; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="logo-area">
            <h1>HappyWorld</h1>
        </div>

        <div class="neo-input-group">
            <input type="number" id="rm" class="neo-input" placeholder="Mobile Number">
        </div>
        <div class="neo-input-group">
            <input type="password" id="rp" class="neo-input" placeholder="Security Password">
        </div>
        <div class="neo-input-group">
            <input type="text" id="ri" class="neo-input" placeholder="Invite Code">
        </div>

        <button class="btn-11" onclick="register()">Sync Account</button>
        
        <div class="footer">
            Already in? <a href="login.html">Login Now</a>
        </div>
    </div>

<script>
    // Firebase Config (Tera apna master config)
    const firebaseConfig = {
        apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", 
        authDomain: "happy-world-25c08.firebaseapp.com",
        databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com",
        projectId: "happy-world-25c08",
        storageBucket: "happy-world-25c08.appspot.com",
        messagingSenderId: "192294282796",
        appId: "1:192294282796:web:be56e1..."
    };
    firebase.initializeApp(firebaseConfig);

    function register() {
        const m = document.getElementById("rm").value;
        const p = document.getElementById("rp").value;
        if(m.length < 10) return;

        firebase.database().ref('users/' + m).set({
            mobile: m, password: p, balance: 0
        }).then(() => {
            localStorage.setItem("userMobile", m);
            window.location.href = "home.html";
        });
    }
</script>
</body>
</html>
