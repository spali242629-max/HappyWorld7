<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HappyWorld - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a1428; /* Dark blue theme like Tiranga */
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: #111b3a; /* Slightly lighter dark blue */
      border-radius: 20px;
      padding: 30px 25px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    
    .back {
      font-size: 1.8rem;
      color: #a0a0ff;
      cursor: pointer;
      margin-bottom: 15px;
    }
    
    .logo {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #00aaff, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #a0a0ff;
      margin-bottom: 30px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #c0c0ff;
    }
    
    .icon {
      font-size: 1.4rem;
      margin-right: 10px;
      color: #00aaff;
    }
    
    input {
      width: 100%;
      padding: 14px 16px 14px 50px;
      background: #1a2545;
      border: 1px solid #2a3560;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #00aaff;
      box-shadow: 0 0 0 3px rgba(0, 170, 255, 0.2);
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #00aaff;
    }
    
    .eye {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #a0a0ff;
      cursor: pointer;
    }
    
    .invite {
      margin-top: 10px;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      margin: 20px 0;
      font-size: 0.9rem;
      color: #c0c0ff;
    }
    
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      accent-color: #00aaff;
    }
    
    a {
      color: #00ffff;
      text-decoration: none;
    }
    
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, #00aaff, #0088cc);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      opacity: 0.5;
      pointer-events: none;
    }
    
    button.active {
      opacity: 1;
      pointer-events: auto
