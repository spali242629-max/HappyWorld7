<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyWorld | Register</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f5f5f5; color: #333; }

        /* Top Header - Branded Blue */
        .header {
            background: #2b32b2; height: 180px; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-bottom-left-radius: 50px; border-bottom-right-radius: 50px;
        }
        .header h1 { color: #fff; font-size: 28px; letter-spacing: 1px; text-transform: uppercase; }
        .header p { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 5px; }

        /* Register Card */
        .main-card {
            margin: -50px 20px 20px; background: #fff; padding: 30px 20px;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #666; }
        .input-box input {
            width: 100%; padding: 15px; background: #f9f9f9; border: 1px solid #eee;
            border-radius: 10px; font-size: 16px; outline: none;
        }
        .input-box input:focus { border-color: #2b32b2; background: #fff; }

        .btn-register {
            width: 100%; padding: 16px; background: #2b32b2; color: #fff;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
            margin-top: 10px; cursor: pointer;
        }

        .login-link { text-align: center; margin-top: 25px; font-size: 14px; color: #888; }
        .login-link a { color: #2b32b2; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

    <div class="header">
        <h1>HappyWorld</h1>
        <p>Official Registration Portal</p>
    </div>

    <div class="main-card">
        <div class="input-box">
            <label>Mobile Number</label>
            <input type="number" id="rm" placeholder="Enter 10 digit number">
        </div>
        <div class="input-box">
            <label>Set Password</label>
            <input type="password" id="rp" placeholder="Enter password">
        </div>
        <div class="input-box">
            <label>Invite Code</label>
            <input type="text" id="ri" placeholder="Enter referral code">
        </div>

        <button class="btn-register" onclick="register()">REGISTER NOW</button>
        
        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAkNNHRLNPE1CxNd9KD...", 
        authDomain: "happy-world-25c08.firebaseapp.com",
        databaseURL: "https://happy-world-25c08-default-rtdb.firebaseio.com",
        projectId: "happy-world-25c08",
        storageBucket: "happy-world-25c08.appspot.com",
        messagingSenderId: "192294282796",
        appId: "1:192294282796:web:be56e1..."
    };
    firebase.initializeApp(firebaseConfig);

    function register() {
        const m = document.getElementById("rm").value;
        const p = document.getElementById("rp").value;
        if(m.length < 10) return alert("Sahi number dalo bhai!");

        firebase.database().ref('users/' + m).set({
            mobile: m, password: p, balance: 0
        }).then(() => {
            localStorage.setItem("userMobile", m);
            window.location.href = "home.html";
        });
    }
</script>
</body>
</html>
