<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Tiranga Style</title>
    <style>
        body { background: #090e1f; color: white; font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* 1. Main Banner Photo */
        .banner {
            width: 100%;
            height: 180px;
            background-image: url('https://img.freepik.com/free-vector/abstract-blue-fluid-background_53876-101457.jpg'); /* Yahan apni photo ka link dalein */
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid #2196f3;
        }

        .header-logo { padding: 10px; text-align: center; background: #1a233b; }
        .header-logo img { height: 40px; } /* Tiranga Logo yahan aayega */

        /* 2. Game Grid (WinGo Photo) */
        .game-section { padding: 15px; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; border-left: 4px solid #ff9800; padding-left: 10px; }
        
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .game-card {
            background: #1c2645;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .game-card img { width: 100%; height: 120px; object-fit: cover; }
        .game-name { padding: 8px; font-weight: bold; font-size: 14px; }

        .footer-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #161d3a; padding: 15px 0; }
    </style>
</head>
<body>

    <div class="header-logo">
        <h2 style="margin:0; color:#2196f3;">Tiranga Games</h2>
    </div>

    <div class="banner"></div>

    <div class="game-section">
        <div class="section-title">Lottery Games</div>
        <div class="game-grid">
            
            <div class="game-card" onclick="location.href='wingo.html'">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR65eKk8-G-W-f4R0B9e99Xf0x6-9-v-9-v-Q&s" alt="WinGo">
                <div class="game-name">WinGo 1Min</div>
            </div>

            <div class="game-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6-m_0_x69R5O-nQ3hI7Jj_7v6O4E3fX8Wzg&s" alt="K3">
                <div class="game-name">K3 Lotre</div>
            </div>

        </div>
    </div>

    <nav class="footer-nav">
        <span>🏠 Home</span>
        <span onclick="location.href='index.html'">👤 Account</span>
    </nav>

</body>
</html>
