<!DOCTYPE html>

    <style>
        body { background: #0d122b; color: white; font-family: sans-serif; margin: 0; padding: 0; padding-bottom: 80px; }
        .header { background: #161d3a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .banner { width: 92%; margin: 15px auto; height: 150px; background: linear-gradient(45deg, #ff9800, #ffc107); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .game-card { background: #1c244a; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #3a467d; text-decoration: none; color: white; transition: 0.3s; }
        .game-card:active { transform: scale(0.95); }
        .game-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .game-name { font-weight: bold; font-size: 16px; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #161d3a; padding: 10px 0; border-top: 1px solid #333; z-index: 1000; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; text-align: center; }
        .bottom-nav a.active { color: #ffeb3b; }
        
        .go-btn-container { margin-top: -30px; }
        .go-btn { background: #ff9800; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; border: 5px solid #0d122b; box-shadow: 0 0 10px rgba(255,152,0,0.5); }
    </style>
</head>
