<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyWorld - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

    <header class="header">
        <div class="logo">HappyWorld</div>
        <div class="wallet-top">₹<span>0.58</span></div>

    <div class="game-container">

            <div class="game-icon">💰</div>

        <div class="game-card blue">

            <div class="game-icon">✈️</div>
            <div class="game-title">Aviator</div>

            <div class="game-icon">💣</div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">🏠<br>Home</a>
