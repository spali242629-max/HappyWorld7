<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo - HappyWorld</title>
    <style>
        body { background: #0d122b; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #161d3a; align-items: center; }
        .game-area { background: #1c244a; margin: 15px; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #3a467d; }
        .timer { font-size: 40px; font-weight: bold; color: #ffeb3b; }
        .btn-box { display: flex; justify-content: space-around; margin-top: 20px; }
        .btn { padding: 15px 30px; border-radius: 10px; border: none; font-weight: bold; color: white; font-size: 16px; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #161d3a; padding: 10px 0; }
        .bottom-nav a { color: #888; text-decoration: none; font-size: 11px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <a href="home.html" style="color:white; text-decoration:none;">⬅️ Back</a>
        <div>WinGo 1Min</div>
        <div id="user-balance" style="font-weight:bold; color:#ffeb3b;">₹0.00</div>
    </div>
    <div class="game-area">
        <div style="color:#aaa;">Period: 20260209123</div>
        <div class="timer" id="countdown">01:00</div>
        <div class="btn-box">
            <button class="btn" style="background:#4caf50;">Green</button>
            <button class="btn" style="background:#9c27b0;">Violet</button>
            <button class="btn" style="background:#f44336;">Red</button>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="home.html">🏠<br>Home</a>
        <a href="activity.html">🏆<br>Activity</a>
        <a href="promotion.html">📢<br>Promotion</a>
        <a href="index.html">👤<br>Account</a>
    </nav>
    <script>
        window.onload = function() {
            let currentMobile = localStorage.getItem('currentUser');
            if (currentMobile) {
                let userData = JSON.parse(localStorage.getItem('user_' + currentMobile));
                document.getElementById('user-balance').innerText = "₹" + userData.balance.toFixed(2);
            }
        };
        // Timer Logic
        let time = 60;
        setInterval(() => {
            time--;
            if(time < 0) time = 60;
            let min = Math.floor(time / 60);
            let sec = time % 60;
            document.getElementById('countdown').innerText = `0${min}:${sec < 10 ? '0'+sec : sec}`;
        }, 1000);
    </script>
</body>
</html>
    <div class="game-buttons">
        <button class="btn green" onclick="bet('Green')">Green</button>
        <button class="btn violet" onclick="bet('Violet')">Violet</button>
        <button class="btn red" onclick="bet('Red')">Red</button>
    </div>

    <div class="history">
        <h3 style="text-align:left; padding-left:10px;">Game History</h3>
        <table class="history-table">
            <thead>
                <tr style="background:#1c244a;"><th>Period</th><th>Num</th><th>Size</th><th>Color</th></tr>
            </thead>
            <tbody id="history-body">
                <tr><td>122</td><td>5</td><td>Big</td><td style="color:#4caf50;">Green</td></tr>
                <tr><td>121</td><td>2</td><td>Small</td><td style="color:#f44336;">Red</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="bottom-nav">
    <a href="home.html">🏠<br>Home</a>
    <a href="activity.html">🏆<br>Activity</a>
    <div class="go-btn-container"><div class="go-btn">GO</div></div>
    <a href="#">📢<br>Promotion</a>
    <a href="index.html">👤<br>Account</a>
</nav>


    <script>
        let seconds = 60;
        setInterval(() => {
            seconds--;
            if(seconds < 0) seconds = 60;
            let displaySec = seconds < 10 ? '0'+seconds : seconds;
            document.getElementById('timer').innerHTML = "00:" + displaySec;
        }, 1000);

        function bet(color) {
            alert("Aapne " + color + " par bet lagayi! System connect ho raha hai...");
        }
    </script>
</body>
</html>
