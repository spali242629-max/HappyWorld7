<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo Tiranga Style</title>
    <style>
        body { background: #1a237e; color: white; font-family: 'Arial', sans-serif; margin: 0; padding-bottom: 80px; }
        .top-nav { padding: 15px; display: flex; align-items: center; background: #1a237e; }
        
        /* Wallet Section */
        .wallet-card { background: #283593; margin: 15px; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .balance { font-size: 28px; font-weight: bold; margin: 10px 0; }
        .wallet-btns { display: flex; justify-content: space-around; margin-top: 15px; }
        .w-btn { padding: 10px 30px; border-radius: 25px; border: none; font-weight: bold; color: white; cursor: pointer; }

        /* Game Area */
        .game-box { background: #3949ab; margin: 15px; border-radius: 20px; padding: 15px; }
        .timer-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #5c6bc0; padding-bottom: 10px; }
        
        /* Number Grid */
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .num-btn { width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: auto; }
        
        /* Color Mapping */
        .n0, .n5 { background: linear-gradient(135deg, #9c27b0, #f44336); } /* Violet + Red/Green */
        .n1, .n3, .n7, .n9 { background: #4caf50; } /* Green */
